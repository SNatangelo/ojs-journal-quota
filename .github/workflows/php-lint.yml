name: PHP syntax

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  php-lint:
    name: PHP syntax / php-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - name: Lint PHP files
        run: find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Check Bash test runner syntax
        run: |
          for script in tests/*.sh; do bash -n "$script"; done
      - name: Test target safeguards (no Docker, OJS or network)
        run: bash tests/safety-test.sh
      - name: Test PHP preflight and snapshot guards (synthetic fixtures)
        run: php tests/preflight-test.php
      - name: Check file copyright and SPDX headers
        run: |
          while IFS= read -r -d '' path; do
            [[ "$path" == "LICENSE" || "$path" == docs/images/*.png ]] && continue
            head -n 20 "$path" | grep -Fq "$path" || { echo "Missing file identifier: $path"; exit 1; }
            head -n 20 "$path" | grep -Fq 'Copyright (C) 2026 Stefano Natangelo' || { echo "Missing copyright: $path"; exit 1; }
            head -n 20 "$path" | grep -Fq 'SPDX-License-Identifier: AGPL-3.0-only' || { echo "Missing SPDX: $path"; exit 1; }
          done < <(git ls-files -z)
