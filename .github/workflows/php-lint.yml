name: PHP syntax

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish release (requires verified OJS installation and upgrade tests)'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  php-lint:
    name: PHP syntax / php-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - name: Lint PHP files
        run: find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Check Bash test runner syntax
        run: |
          for script in tests/*.sh; do bash -n "$script"; done
      - name: Test target safeguards (no Docker, OJS or network)
        run: bash tests/safety-test.sh
      - name: Test PHP preflight and snapshot guards (synthetic fixtures)
        run: php tests/preflight-test.php
      - name: Check file copyright and SPDX headers
        run: |
          while IFS= read -r -d '' path; do
            # The CLA text carries its own CC BY 3.0 notice and a fixed hash
            [[ "$path" == "LICENSE" || "$path" == docs/images/*.png || "$path" == "CLA.md" || "$path" == .github/cla/agreements/*.md ]] && continue
            head -n 20 "$path" | grep -Fq "$path" || { echo "Missing file identifier: $path"; exit 1; }
            head -n 20 "$path" | grep -Fq 'Copyright (C) 2026 Stefano Natangelo' || { echo "Missing copyright: $path"; exit 1; }
            head -n 20 "$path" | grep -Fq 'SPDX-License-Identifier: AGPL-3.0-only' || { echo "Missing SPDX: $path"; exit 1; }
          done < <(git ls-files -z)

      - name: Build and verify release archive
        run: python3 scripts/package-release.py
      - name: Store verified package
        uses: actions/upload-artifact@v4
        with:
          name: journal-quota-release
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish verified release
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    needs: php-lint
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: journal-quota-release
          path: dist
      - name: Publish release for the tested commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(python3 -c 'import xml.etree.ElementTree as E; print(E.parse("version.xml").findtext("release"))')
          [[ "$version" =~ ^[0-9]+(\.[0-9]+){3}$ ]]
          archive="journalQuota-$version.tar.gz"
          (cd dist && md5sum -c "$archive.md5" && sha256sum -c "$archive.sha256")
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "Tag already exists; refusing to replace a published version." >&2
            exit 1
          else
            status=$?
            [[ "$status" == 2 ]] || exit "$status"
          fi
          gh release create "v$version" "dist/$archive" "dist/$archive.md5" "dist/$archive.sha256" \
            --target "$GITHUB_SHA" --title "Journal Quota $version" --generate-notes
